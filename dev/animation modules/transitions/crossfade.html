<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>

    <style>

      body
      {
          margin: 0;
          background-color: #000000;
      }

      #mainCanvas
      {
          width: 1194px;
          margin-left: auto;
          margin-right: auto;
          display: block;
      }

    </style>

  </head>
  <body>

      <canvas id="mainCanvas" class="mainCanvas" width="1194" height="571"></canvas>

  </body>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
  <script>

    var bufferCanvas = createInvisibleCanvas("bufferCanvas", mainCanvas.width, mainCanvas.height);
    var bufferContext = bufferCanvas.getContext("2d");

    var stage = new createjs.Stage("mainCanvas"); //switch to bufferCanvas later
    var maskContainer = new createjs.Container();

    var crossFadeBoxArray = new Array();

    var xPosition = -1;
    var yPosition = -1;

    gsap.ticker.add(function() {
        stage.update();
    });

    function createCrossFade()
    {
        for(var i=0;i<200;i++)
        {
          xPosition++;

          var roundRect = new createjs.Shape();
          roundRect.graphics.beginFill("red").drawRoundRect(0, 0, 1000, 5, 0, 0, 0, 0);

          if(i % 2 == 0
          && i !== 0)
      		{
      			xPosition = 0;
      			yPosition += 5; //tighten up the spacing so it can achieve the roll down effect
      		}

          roundRect.x = xPosition * 1000;
          roundRect.y = yPosition;

          roundRect.scaleX = roundRect.scaleY = 1;

          crossFadeBoxArray.push(roundRect);

          maskContainer.addChild(roundRect);
        }

        stage.addChild(maskContainer);
        stage.update();
    }

    function animateCrossfade()
    {
        for(var i=0;i<crossFadeBoxArray.length;i++)
        {
            gsap.to(crossFadeBoxArray[i], {
              duration: 1,
              alpha: 0,
              delay: i / 300,
            });
        }
    }

    function resetCrossfade()
    {
        crossFadeBoxArray.reverse();

        for(var i=0;i<crossFadeBoxArray.length;i++)
        {
            crossFadeBoxArray[i].alpha = 1;
        }
    }

    //creates invisible canvas for buffering
    function createInvisibleCanvas(id, width, height)
    {
        var tempCanvas;

        if(document.getElementById(id) !== null)
        {
            tempCanvas = document.getElementById(id);
        } else {

            tempCanvas = document.createElement("canvas");
            tempCanvas.width = width;
            tempCanvas.height = height;
            tempCanvas.id = id;
            tempCanvas.style.display = "block";
            document.body.appendChild(tempCanvas);
        }

        return tempCanvas;
    }

    createCrossFade();
    animateCrossfade();



  </script>


</html>
