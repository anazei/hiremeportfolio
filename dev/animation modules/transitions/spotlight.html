  <script>

    var bufferCanvas = createInvisibleCanvas("bufferCanvas", mainCanvas.width, mainCanvas.height);
    var bufferContext = bufferCanvas.getContext("2d");

    var stage = new createjs.Stage("mainCanvas"); //switch to bufferCanvas later
    var maskContainer = new createjs.Container();

    gsap.ticker.add(function() {
        stage.update();
    });

    var spotlightImage = new Image();
    spotlightImage.src = "masktest2.png";
    spotlightImage.onload = createSpotlight;

    function createSpotlight()
    {
        var rect = new createjs.Shape();
        rect.graphics.beginFill("black").drawRoundRect(0, 0, 1194, 571, 0, 0, 0, 0);

        rect.alpha = 0;

        stage.addChild(rect);

        var bitmap = new createjs.Bitmap(document.getElementById("spotlight"));

        bitmap.width = 1194;
        bitmap.height = 571;

        // Set registration point to image center
        //bitmap.regX = 597;
        //bitmap.regY = 285.5;

        // Set initial position
        bitmap.x = 0;
        bitmap.y = 0;

        bitmap.alpha = 0;

        stage.addChild(bitmap);

        gsap.to(bitmap, {
            alpha: 1,
            duration: 2,
        });

        gsap.to(rect, {
            alpha: 1,
            duration: 1,
            delay: 1.5,
        });
    }

    //creates invisible canvas for buffering
    function createInvisibleCanvas(id, width, height)
    {
        var tempCanvas = document.createElement("canvas");
            tempCanvas.width = width;
            tempCanvas.height = height;
            tempCanvas.id = id;
            tempCanvas.style.display = "block";
            document.body.appendChild(tempCanvas);
        return tempCanvas;
    }
