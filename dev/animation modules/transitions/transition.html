<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>

    <style>

      body {
        margin: 0;
        background-color: #FFFFFF;
      }

      #mainCanvas{
        width: 1194px;
        height: 571px;
        margin-left: auto;
        margin-right: auto;
        display: block;
      }

    </style>

  </head>
  <body>

    <canvas id="mainCanvas" class="mainCanvas" width="1194" height="571"></canvas>

  </body>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
  <script src="maskwall.js"></script>
  <script src="spotlight.js"></script>
  <script src="crossfade.js"></script>
  <script>

    var mainCanvas = document.getElementById("mainCanvas");
    var mainContext = mainCanvas.getContext("2d");

    var crossfade = new Crossfade(mainCanvas);
    //var maskwall = new Maskwall(mainCanvas);
    //var spotlight = new Spotlight(mainCanvas);


    var runOnMainLoop = false;

    var originalImage = createInvisibleCanvas("blankCanvas", mainCanvas.width, mainCanvas.height); //current image on display
    var newImage = new Image(); //new incoming image

    var testCanvas = createInvisibleCanvas("testCanvas", mainCanvas.width, mainCanvas.height);
    var testContext = maskCanvas.getContext("2d");

    //setup which ever mask is selected
    function selectMask(mask, imageSrc)
    {
        //setup mask
        mask.setupMask(); //method to call mask object

        //set the new incoming image
        var image = new Image();
            image.src = imageSrc;

        image.onload = function()
        {
            newImage = image;
            animateMask(mask);
        }
    }

    //main animation transition command
    function onMainloop()
    {
        mainContext.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

        // 1) mask from mask canvas is drawn first
        mainContext.drawImage(document.getElementById("maskCanvas"), 0, 0); //main canvas draws/copies animated buffer mask canvas first and sets "source in" composition

        //mainContext.globalCompositeOperation = "source-in";

        // 2) then newImage will automatically get masked
        //mainContext.drawImage(newImage, 0, 0); //draw out new image

        //mainContext.globalCompositeOperation = "destination-atop";

        // 3) originalImage gets drawn last with "destination-atop" set beforehand
        //mainContext.drawImage(originalImage, 0, 0); //draw out original image

        if(runOnMainLoop == true)
        {
            requestAnimationFrame(onMainloop);
        }
    }

    //animate the specific mask
    function animateMask(mask)
    {
        //allow main loop to run
        runOnMainLoop = true;

        //start on main loop
        onMainloop();

        //run mask animation
        mask.startAnimate(); //method to call mask object

        //after set amount of time, call onMaskComplete
        setTimeout(function(){

            onMaskComplete(mask); //this should really be a call back for mask object to call back to say maskComplete by providing "this" reference

        }, 3000);
    }

    //when masking animation is complete, reset for next mask setup
    function onMaskComplete(mask)
    {
        //stop on main loop when done
        runOnMainLoop = false;

        //set permanent image state
        originalImage = newImage; //current image on display
        newImage = new Image(); //reset new incoming image

        //reset mask state
        mask.resetMaskState(); //method to call mask object
    }

    //creates invisible canvas for buffering
    function createInvisibleCanvas(id, width, height)
    {
        var tempCanvas;

        if(document.getElementById(id) !== null)
        {
            tempCanvas = document.getElementById(id);
        } else {

            tempCanvas = document.createElement("canvas");
            tempCanvas.width = width;
            tempCanvas.height = height;
            tempCanvas.id = id;
            tempCanvas.style.display = "block";
            document.body.appendChild(tempCanvas);
        }

        return tempCanvas;
    }

    selectMask(crossfade, "background.png"); //maskwall, spotlight, crossfade

  </script>
</html>
