<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style>

      body
      {
          margin-left: 0px;
          margin-right: 0px;
          margin-top: 0px;
          margin-bottom: 0px;
          overflow-x: hidden;
          overflow-y: hidden;
          background-color: #000000;
          user-select: none;
      }

      .navText
      {
          color: white;
          font-family: "Arial", sans-serif;
          color: #909A9A;
          font-size: 26pt;
          letter-spacing: 1px;
      }

      .marginLeft25
      {
          margin-left: 25px;
      }

      #navContainer
      {
      }

      #slideNavContainer
      {

      }

    </style>

  </head>
  <body>

      <div id="navContainer">
        <span id="navDownloadCV" class="navText marginLeft25">Download CV</span>
        <span id="navSep1" class="navText marginLeft25">|</span>
        <span id="navPortfolio" class="navText marginLeft25">Portfolio</span>
        <span id="navSep2" class="navText marginLeft25">|</span>
        <span id="navBehindScenes" class="navText marginLeft25">Behind the scenes</span>
      </div>

      <div id="slideNavContainer">
        <span id="slideNavNext" class="navText marginLeft25" style="font-size: 20pt;">NEXT</span>
        <span id="slideNavSep" class="navText marginLeft25">|</span>
        <span id="slideNavPrevious" class="navText marginLeft25" style="font-size: 20pt;">PREVIOUS</span>
        <span id="slideNavPage" class="navText marginLeft25">1 / 3</span>
      </div>

  </body>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

  <script>

    var mainNavArray = ["navDownloadCV", "navPortfolio", "navBehindScenes", "navSep1", "navSep2"];
    var nextPreviousArray = ["slideNavNext", "slideNavPrevious", "slideNavSep"];

    function navListeners()
    {
        document.getElementById("navDownloadCV").addEventListener("click", function(){
            lightupNavItem("navDownloadCV", mainNavArray);
        });

        document.getElementById("navPortfolio").addEventListener("click", function(){
            lightupNavItem("navPortfolio", mainNavArray);
        });

        document.getElementById("navBehindScenes").addEventListener("click", function(){
            lightupNavItem("navBehindScenes", mainNavArray);
        });

        document.getElementById("slideNavNext").addEventListener("click", function(){
            lightupNavItem("slideNavNext", nextPreviousArray);
        });

        document.getElementById("slideNavPrevious").addEventListener("click", function(){
            lightupNavItem("slideNavPrevious", nextPreviousArray);
        });
    }

    function lightupNavItem(divID, array)
    {
        for(let i=0;i<array.length;i++)
        {
            if(array[i] !== divID)
            {
                //non selected navs
                gsap.to("#" + array[i], {
                    alpha: .5,
                    filter: "blur(5px)",
                    duration: .35,
                });

                setTimeout(function(){

                    for(var i=0;i<array.length;i++)
                    {
                        gsap.to("#" + array[i], {
                            alpha: 1,
                            filter: "blur(0px)",
                            duration: .35,
                        });
                    }
                }, 1000);

            } else {

              //selected nav
              gsap.to("#" + array[i], {
                  alpha: 1,
                  filter: "drop-shadow(0px 0px 5px rgba(255, 255, 255, 1))",
                  color: "white",
                  duration: .75,
                  onComplete: function(){

                      gsap.to("#" + this.targets()[0].id, {
                          alpha: 1,
                          filter: "drop-shadow(0px 0px 0px rgba(255, 255, 255, 0))",
                          color: "#909A9A",
                          duration: .35,
                      });
                  }
              });
            }
        }
    }

    navListeners();


  </script>

</html>
