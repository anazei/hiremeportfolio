<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>

    <style>

      body
      {
          margin-left: 0px;
          margin-right: 0px;
          margin-top: 0px;
          margin-bottom: 0px;
          overflow-x: hidden;
          overflow-y: hidden;
          background-color: #132322;
      }



      #progressBarContainer
      {
          width: 435px;
          height: 85px;
          background-color: #111C1C;
          font-family: "Arial", sans-serif;
          color: #909A9A;
          font-size: 8pt;
          letter-spacing: 2px;
          text-transform: lowercase;
          border-radius: 5px;

          position: absolute;
          left: 500px;
          top: 350px;
      }

      #progress
      {
          overflow: hidden;
          background-image: url("progressbar.png");
          background-repeat: repeat-x;
          background-size: auto 15px;
          background-position: 0 0;
          width: 326px;
          height: 15px;
          position: absolute;
          left: 55px;
          top: 35px;
          opacity: .5;
      }

      #progressBorder
      {
          width: 335px;
          height: 22px;
          border-style: solid;
          border-width: 1px;
          border-color: #717C7C;
          position: absolute;
          left: 50px;
          top: 30px;
      }

      #scrambleTextProgressBar
      {
          position: absolute;
          left: 260px;
          top: 60px;
      }

    </style>

  </head>
  <body>

      <div id="progressBarContainer">
        <div id="progress"></div>
        <div id="progressBorder"></div>
        <div id="scrambleTextProgressBar"></div>
      </div>

  </body>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>

    var progressAnimationNumberCounter = 9967;
    var runProgressBarNumberCounter = true;
    var progressBarRotatingText;

    //continuously random rotating progress bar text
    function generateRotatingProgressBarText(textLength)
    {
        progressAnimationNumberCounter += 46;
        document.getElementById("scrambleTextProgressBar").innerHTML = "initializing..." + progressAnimationNumberCounter;
    }

    function startProgressBarRotatingText()
    {
        gsap.fromTo("#progress", {
          backgroundPositionX: "0px"
          },
          {
            backgroundPositionX: "-30px",
            duration: .5,
            ease: "none",
            repeat: -1
          }
        );
        
        progressBarRotatingText = setInterval(function(){

          if(runProgressBarNumberCounter == true)
          {

              generateRotatingProgressBarText(25);

          } else {

              clearInterval(progressBarRotatingText);
          }
        }, 15);
    }

    function stopProgressBarRotatingText()
    {
        runProgressBarNumberCounter = false;
    }


    startProgressBarRotatingText();

  </script>

</html>
