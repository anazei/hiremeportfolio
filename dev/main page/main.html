<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Hello Giftagram!</title>

    <!-- include this for Roboto font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style>

      body
      {
          margin-left: 0px;
          margin-right: 0px;
          margin-top: 0px;
          margin-bottom: 0px;
          overflow-x: hidden;
          overflow-y: hidden;
          background-color: #000000;
      }

      #mainCanvas
      {
          position: fixed;
          left: 0px;
          top: 0px;
          z-index: 1;
      }

      #gridCrossGroup
      {
          position: absolute;
          z-index: 2;
      }

      #progressBarContainer
      {
          width: 0px;
          height: 0px;
          background-color: #111C1C;
          font-family: "Arial", sans-serif;
          color: #909A9A;
          font-size: 8pt;
          letter-spacing: 2px;
          text-transform: lowercase;
          border-radius: 5px;
          opacity: .65;
          position: absolute;
          left: 300px;
          top: 350px;
          z-index: 10;
      }

      #progress
      {
          overflow: hidden;
          background-image: url("images/progressbar.png");
          background-repeat: repeat-x;
          background-size: auto 15px;
          background-position: 0 0;
          width: 326px;
          height: 15px;
          position: absolute;
          left: 55px;
          top: 35px;
          opacity: .85;
          opacity: 0;
      }

      #progressBorder
      {
          width: 335px;
          height: 22px;
          border-style: solid;
          border-width: 1px;
          border-color: #717C7C;
          position: absolute;
          left: 50px;
          top: 30px;
          opacity: 0;
      }

      #scrambleTextProgressBar
      {
          position: absolute;
          left: 260px;
          top: 60px;
          opacity: 0;
      }

      #heroTitleMasterContainer
      {
          background-color: #111C1C;
          border-radius: 5px;
          opacity: .45;
          position: absolute;
          left: 100px;
          top: 100px;
          text-transform: uppercase;
          z-index: 30;
      }

      #heroTitleContainer1
      {
          position: absolute;
          left: 50px;
          top: 50px;
          font-family: 'Roboto', monospace;
          font-size: 18pt;
          font-weight: 300;
          letter-spacing: 0px;
      }

      #heroTitleContainer2
      {
          position: absolute;
          left: 400px;
          top: 60px;
          font-family: 'Roboto', monospace;
          font-size: 24pt;
          font-weight: 300;
          letter-spacing: 0px;
      }

    </style>

  </head>

  <body>

    <!-- begin grid cross group background -->
    <div id="gridCrossGroup">
      <div id="masterGrid"></div>
      <div id="masterCross"></div>
    </div>
    <!-- end grid cross group background -->

    <!-- begin transitions background -->
    <canvas id="mainCanvas" class="mainCanvas" width="1920" height="1080"></canvas>
    <!-- end transitions background -->

    <!-- begin progress bar animation -->
    <div id="progressBarContainer">
      <div id="progress"></div>
      <div id="progressBorder"></div>
      <div id="scrambleTextProgressBar"></div>


        <!-- begin hero title -->
        <div id="heroTitleMasterContainer">
          <div id="heroTitleContainer1">
            <div id="heroTitle1"></div>
            <div id="heroTitle2"></div>
          </div>

          <div id="heroTitleContainer2">
            <div id="heroTitle3"></div>
            <div id="heroTitle4"></div>
          </div>
        </div>
        <!-- end hero title -->

    </div>
    <!-- end progress bar animation -->



  </body>

  <script src="js/gsap.min.js"></script>
  <script src="js/easeljs.min.js"></script>

  <!-- <script src="js/giftagramlogo.js"></script> -->

  <script src="js/maskwall.js"></script>
  <script src="js/spotlight.js"></script>
  <script src="js/crossfade.js"></script>
  <script src="js/background.js"></script>
  <script src="js/gridcross.js"></script>
  <script src="js/progressbar.js"></script>
  <script src="js/herotitle.js"></script>

  <script>

    //animateInGridCrossBackground();
    //animateBackgroundGrid(5, 15)
    //animateRollingGrid(15, 20)
    //animateOutGridCrossBackground()
    //instantRedraw()
    //circularGridAnimation(25, 25, 10)

    //createHeroTitle1("gift  giving  isn't  just  about  giving  things . . .");

    //animateInProgressBarContainer();
    //animateOutProgressBarContainer();

    var allowRollingGridEffect = true;

    function startMainPage()
    {
        //keyframe
        //setTimeout(function(){
        //}, 100);

        //keyframe
        setTimeout(function(){

            selectMask(crossfade, "images/background1.jpg");

        }, 250);

        //keyframe
        setTimeout(function(){

            animateInGridCrossBackground();

        }, 1350);

        //keyframe
        setTimeout(function(){

            //startRandomRollingGridEffect();
            //startRandomRollingGridEffect2();

            animateInProgressBarContainer();

        }, 1800);

        //keyframe
        setTimeout(function(){

            createHeroTitle1("gift  giving  isn't  just  about  giving  things . . .");

        }, 2500);

        //keyframe
        setTimeout(function(){

            animateRollingGrid(15, 22);

        }, 2800);

        //keyframe
        setTimeout(function(){

            animateOutHeroTitle();

        }, 5000);

        //keyframe
        setTimeout(function(){

            animateOutProgressBarContainer();

        }, 7000);


    }

    function startRandomRollingGridEffect()
    {
        var delayer = setInterval(function(){

          if(allowRollingGridEffect == true)
          {
              var minRange = Math.round(Math.random() * 4) + 7;
              var maxRange = Math.round(Math.random() * 10) + 10;

              animateRollingGrid(minRange, maxRange);
          } else {
              clearInterval(delayer);
          }

        }, Math.round(Math.random() * 8000) + 4000);
    }

    function startRandomRollingGridEffect2()
    {
        var delayer = setInterval(function(){

          if(allowRollingGridEffect == true)
          {
              var minRange = Math.round(Math.random() * 10) + 8;
              var maxRange = Math.round(Math.random() * 15) + 10;

              animateRollingGrid(minRange, maxRange);
          } else {
              clearInterval(delayer);
          }

        }, Math.round(Math.random() * 7000) + 3000);
    }

    function stopRandomRollingGridEffect()
    {
        allowRollingGridEffect = false;
    }

    startMainPage();




  </script>

</html>
