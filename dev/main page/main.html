<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Hello Giftagram!</title>

    <!-- include this for Roboto font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <style>

      body
      {
          margin-left: 0px;
          margin-right: 0px;
          margin-top: 0px;
          margin-bottom: 0px;
          overflow-x: hidden;
          overflow-y: hidden;
          background-color: #000000;
          user-select: none;
      }

      #mainCanvas
      {
          position: fixed;
          left: 0px;
          top: 0px;
          z-index: 1;
      }

      #gridCrossGroup
      {
          position: absolute;
          z-index: 2;
      }

      #progressBarContainer
      {
          width: 0px;
          height: 0px;
          background-color: #111C1C;
          font-family: "Arial", sans-serif;
          color: #909A9A;
          font-size: 8pt;
          letter-spacing: 2px;
          text-transform: lowercase;
          border-radius: 5px;
          opacity: .65;
          position: absolute;
          left: 300px;
          top: 350px;
          z-index: 10;
      }

      #progress
      {
          overflow: hidden;
          background-image: url("images/progressbar.png");
          background-repeat: repeat-x;
          background-size: auto 15px;
          background-position: 0 0;
          width: 326px;
          height: 15px;
          position: absolute;
          left: 55px;
          top: 35px;
          opacity: .85;
          opacity: 0;
      }

      #progressBorder
      {
          width: 335px;
          height: 22px;
          border-style: solid;
          border-width: 1px;
          border-color: #717C7C;
          position: absolute;
          left: 50px;
          top: 30px;
          opacity: 0;
      }

      #scrambleTextProgressBar
      {
          position: absolute;
          left: 260px;
          top: 60px;
          opacity: 0;
      }

      #heroTitleMasterContainer
      {
          background-color: #111C1C;
          border-radius: 5px;
          opacity: .45;
          position: absolute;
          left: 100px;
          top: 100px;
          text-transform: uppercase;
          z-index: 30;
      }

      #heroTitleContainer1
      {
          position: absolute;
          left: 50px;
          top: 50px;
          font-family: 'Roboto', monospace;
          font-size: 18pt;
          font-weight: 300;
          letter-spacing: 0px;
      }

      #heroTitleContainer2
      {
          position: absolute;
          left: 400px;
          top: 60px;
          font-family: 'Roboto', monospace;
          font-size: 24pt;
          font-weight: 300;
          letter-spacing: 0px;
      }

      #masterBufferContainer
      {
          position: absolute;
          left: 50px;
          bottom: 0%;
          z-index: 10;
          opacity: 0.35;
      }

      .bufferBar
      {
          width: 50px;
          height: 2px;
          background-color: white;
          margin-bottom: 5px;
          position: relative;
          opacity: 0;
      }

      #bufferBarReadyText,
      .bufferBarText
      {
          color: white;
          font-size: 8pt;
          font-family: monospace, sans-serif;
          text-transform: uppercase;
          position: relative;
          left: 60px;
          top: -95px;
          opacity: 0;
      }

      #circleContainer
      {
          position: relative;
          top: -250px;
          width: 150px;
          height: 150px;
          z-index: 10;
      }

      .rectangle
      {
          position: absolute;
          width: 8px;
          height: 4px;
          background-color: #D1D1D1;
          transform-origin: 50% 50%;
          /* border-radius: 5px; */
      }

    </style>

  </head>

  <body>

    <!-- begin grid cross group background -->
    <div id="gridCrossGroup">
      <div id="masterGrid"></div>
      <div id="masterCross"></div>
    </div>
    <!-- end grid cross group background -->

    <!-- begin transitions background -->
    <canvas id="mainCanvas" class="mainCanvas" width="1920" height="1080"></canvas>
    <!-- end transitions background -->

    <!-- begin progress bar animation -->
    <div id="progressBarContainer">
      <div id="progress"></div>
      <div id="progressBorder"></div>
      <div id="scrambleTextProgressBar"></div>


        <!-- begin hero title -->
        <div id="heroTitleMasterContainer">
          <div id="heroTitleContainer1">
            <div id="heroTitle1"></div>
            <div id="heroTitle2"></div>
          </div>

          <div id="heroTitleContainer2">
            <div id="heroTitle3"></div>
            <div id="heroTitle4"></div>
          </div>
        </div>
        <!-- end hero title -->

    </div>
    <!-- end progress bar animation -->

    <!-- begin buffer animation -->
    <div id="masterBufferContainer">

      <div id="bufferBarsContainer"></div>

      <div id="bufferBarText">
        <div id="bufferBarText1" class="bufferBarText">Brainstorming...</div>
        <div id="bufferBarText2" class="bufferBarText">Formal planning...</div>
        <div id="bufferBarText3" class="bufferBarText">Storyboarding...</div>
        <div id="bufferBarText4" class="bufferBarText">Design layout...</div>
        <div id="bufferBarText5" class="bufferBarText">Create assets...</div>
        <div id="bufferBarText6" class="bufferBarText">Develop animation...</div>
        <div id="bufferBarText7" class="bufferBarText">Begin story...</div>
      </div>

      <div id="bufferBarReadyText">Ready Go!</div>

      <!-- begin circle spinner -->
      <div id="circleContainer"></div>
      <!-- end circle spinner -->

    </div>
    <!-- end buffer animation -->

  </body>

    function startRandomRollingGridEffect()
    {
        var delayer = setInterval(function(){

          if(allowRollingGridEffect == true)
          {
              var minRange = Math.round(Math.random() * 4) + 7;
              var maxRange = Math.round(Math.random() * 10) + 10;

              animateRollingGrid(minRange, maxRange);
          } else {
              clearInterval(delayer);
          }

        }, Math.round(Math.random() * 8000) + 4000);
    }

    function startRandomRollingGridEffect2()
    {
        var delayer = setInterval(function(){

          if(allowRollingGridEffect == true)
          {
              var minRange = Math.round(Math.random() * 10) + 8;
              var maxRange = Math.round(Math.random() * 15) + 10;

              animateRollingGrid(minRange, maxRange);
          } else {
              clearInterval(delayer);
          }

        }, Math.round(Math.random() * 7000) + 3000);
    }

    function stopRandomRollingGridEffect()
    {
        allowRollingGridEffect = false;
    }

    startMainPage();
