    function startRandomRollingGridEffect()
    {
        var delayer = setInterval(function(){

          if(allowRollingGridEffect == true)
          {
              var minRange = Math.round(Math.random() * 4) + 7;
              var maxRange = Math.round(Math.random() * 10) + 10;

              animateRollingGrid(minRange, maxRange);
          } else {
              clearInterval(delayer);
          }

        }, Math.round(Math.random() * 8000) + 4000);
    }

    function startRandomRollingGridEffect2()
    {
        var delayer = setInterval(function(){

          if(allowRollingGridEffect == true)
          {
              var minRange = Math.round(Math.random() * 10) + 8;
              var maxRange = Math.round(Math.random() * 15) + 10;

              animateRollingGrid(minRange, maxRange);
          } else {
              clearInterval(delayer);
          }

        }, Math.round(Math.random() * 7000) + 3000);
    }

    function stopRandomRollingGridEffect()
    {
        allowRollingGridEffect = false;
    }
