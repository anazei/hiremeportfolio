<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Hello Giftagram!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Condensed:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/index500.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>

      <!-- begin master container -->
      <div id="masterContainer">

          <div id="entryGreetingText"></div>

          <div id="audioVisualizerWindowContainer">
              <canvas id="audioVisualizerBinCanvas" width="500" height="250"></canvas>
              <div id="audioVisualizerTextContainer">
                  <div id="audioVisualizerTitle" class="audioVisualizerText">NOW PLAYING:</div>
                  <div id="audioVisualizerText" class="audioVisualizerText"></div>
                  <div id="audioVisualizerPlayButton"></div>
                  <div id="audioVisualizerPauseButton"></div>
                  <div id="audioVisualizerRepeatButton"></div>
              </div>
              <div id="audioVisualizerBackground"></div>
          </div>

      </div>
      <!-- end master container -->

      <div id="iframeDiv"></div>

  </body>

  <script>

  </script>

  <script src="js/gsap.min.js"></script>
  <script src="js/easeljs.min.js"></script>
  <script src="js/audiomanager.js"></script>
  <script src="js/audiovisualizer.js"></script>

  <script>

      //file URL, type of media
      var preloadArray = new Array();
          preloadArray.push(["audio/climatechange.mp3", "audio"]);
          preloadArray.push(["splash/video/finalcombined.mp4", "video"]);
          preloadArray.push(["main/images/splashbackground4.jpg", "image"]);
          preloadArray.push(["audio/main.mp3", "audio"]);
          preloadArray.push(["main/video/piano.mp4", "video"]);
          preloadArray.push(["main/images/splashbackground3.jpg", "image"]);
          preloadArray.push(["main/images/splashbackground2.jpg", "image"]);
          preloadArray.push(["main/images/splashbackground.jpg", "image"]);
          preloadArray.push(["main/images/advancedMaskTransitions3.jpg", "image"]);
          preloadArray.push(["main/images/AI4.jpg", "image"]);
          preloadArray.push(["main/images/animatedAndividualComponents2.jpg", "image"]);
          preloadArray.push(["main/images/audiovisualizer3.jpg", "image"]);
          preloadArray.push(["main/images/background1.jpg", "image"]);
          preloadArray.push(["main/images/background2.jpg", "image"]);
          preloadArray.push(["main/images/bluebg.jpg", "image"]);
          preloadArray.push(["main/images/drone4.jpg", "image"]);
          preloadArray.push(["main/images/planningstoryboard1.jpg", "image"]);
          preloadArray.push(["main/images/ztransitions.jpg", "image"]);
          preloadArray.push(["main/images/ztransitions2.jpg", "image"]);

      var alreadyClicked = false;
      var preloadCounter = 0;

      //when site first loads, wait for user to go into landscape mode
      function resizeState1()
      {
          location.reload();
      }

      //only reload if not in landscape, this prevents youtube videos entering into full screen from triggering reload
      function resizeState2()
      {
          if(isLandscapeMode() == false)
          {
              location.reload();
          }
      }

      function init()
      {
          for(var i=0;i<preloadArray.length;i++)
          {
              switch(preloadArray[i][1])
              {
                  case "audio":
                  case "video":
                    preloadMedia(preloadArray[i][0]);
                  break;

                  case "image":
                    preloadImage(preloadArray[i][0]);
                  break;
              }
          }

          window.addEventListener("resize", resizeState1);

          window.addEventListener("message", function(event){

              switch(event.data)
              {
                  //load main page after splash page is finished
                  case "iframeClicked":

                      if(currentAudioState == "playing")
                      {
                          music.fadeOut(currentAudioTrack, 2);
                      }

                      setTimeout(function(){

                          loadNewSong("mainMusic", "audio/main.mp3");
                          changeAudioTrackTitle("Somewhere But Not Here - Nicolai Patricio");
                      }, 2000);

                      document.getElementById("mainIframe").src = "main/main.html";
                  break;

                  //entering main landing page
                  case "moveAudioPlayer":

                    //prevents youtube video full screen from reloading page
                    window.removeEventListener("resize", resizeState1); //remove old listener first that reloads on any resize
                    window.addEventListener("resize", resizeState2); //add new listener that is more discriminate on resizing only when not in landscape mode

                    if(window.screen.height > 500)
                    {
                        gsap.to("#audioVisualizerWindowContainer", {
                          y: "-= 75",
                          duration: .5,
                        });
                    }

                  break;

                  case "pauseAudio":

                    pauseSong();

                  break;
              }
          });
      }

      //fade out "this contains audio, click anywhere to begin" text
      function fadeOutGreetingText()
      {
          gsap.to("#entryGreetingText", {
              opacity: 0,
              duration: .35,
          });

          gsap.fromTo("#audioVisualizerWindowContainer",
          {
              opacity: 0,
          },
          {
              opacity: 1,
              duration: 4,
              delay: 10,
          });

          setTimeout(function(){

              changeAudioTrackTitle("Climate Change - Hans Zimmer, Planet Earth III");

          }, 10500);
      }

      //on resize, just reload the entire website
      //on resize, run this function to check if in landscape mode
      //once in landscape mode, show the intro message
      //if the screen width is lesser than the height, then it is in portrait mode
      function isLandscapeMode()
      {
          return window.matchMedia("(orientation: landscape)").matches;
      }

      //preload all the big assets like video and audio and images
      //display preloader animation
      //only after the preloader is completed, then allow user to click to begin
      function checkPreloader()
      {
          document.getElementById("entryGreetingText").innerHTML = "Loading assets: " + preloadCounter + "/" + preloadArray.length;

          if(preloadCounter >= preloadArray.length) //two mp3 and mp4 file can be ignored
          {
              if(isLandscapeMode() == true)
              {
                  //show click message
                  document.getElementById("entryGreetingText").innerHTML = "This portfolio is entirely Javascript driven and custom designed for Giftagram<br>Click anywhere to begin";

                  //allow click to begin
                  window.addEventListener("click", function(){

                      //first click to enter splash page
                      if(alreadyClicked == false)
                      {
                          alreadyClicked = true;

                          loadNewSong("splashMusic", "audio/climatechange.mp3");

                          fadeOutGreetingText();

                          //only load splash page after click to allow audio browser persmission to play
                          var iframe = document.createElement("iframe");
                              iframe.id = "mainIframe";
                              iframe.src = "splash/splash.html";

                          document.getElementById("iframeDiv").appendChild(iframe);
                      }
                  });

              } else {
                  //if not in landscape mode, display "turn your screen into landscape mode to begin"
                  document.getElementById("entryGreetingText").innerHTML = "Please rotate your screen to landscape mode";
              }
          }
      }

      const downloadedMedia = new Map();

      async function preloadMedia(fileURL) {
          try {
              const response = await fetch(fileURL);

              // These static files should return a full response (200).
              // A partial response (206) could contain only part of the file.
              if (response.status !== 200) {
                  throw new Error(`HTTP ${response.status}`);
              }

              const blob = await response.blob();

              if (blob.size === 0) {
                  throw new Error("Empty file");
              }

              downloadedMedia.set(fileURL, URL.createObjectURL(blob));
              //console.log("Downloaded:", fileURL, blob.size, "bytes");

              preloadCounter++;
              checkPreloader();
          } catch (error) {
              //console.error("Media download failed:", fileURL, error);
          }
      }

      function preloadAudio(audioURL)
      {
          var audio = new Audio(audioURL);

          audio.onloadeddata = function(){
              preloadCounter++
              checkPreloader();
          };
      }

      function preloadVideo(videoURL)
      {
          var video = document.createElement("video");
              video.src = videoURL;
              video.preload = "auto";

          video.onloadeddata = function(){
              preloadCounter++
              checkPreloader();
          };
      }

      function preloadImage(imageURL)
      {
          var image = new Image();
              image.src = imageURL;

          image.onload = function(){
              preloadCounter++
              checkPreloader();
          }
      }

      var wakeLock = null;

      async function keepScreenAwake()
      {
          try
          {
              if ("wakeLock" in navigator)
              {
                  wakeLock = await navigator.wakeLock.request("screen");
                  console.log("Screen wake lock activated");
              }
          }
          catch(error)
          {
              console.log("Wake lock failed:", error);
          }
      }

      //detect for mobile devices from https://www.sitepoint.com/navigator-useragent-mobiles-including-ipad/
      function detectMobile()
      {
          var result = (navigator.userAgent.match(/(iphone)|(ipod)|(ipad)|(android)|(blackberry)|(windows phone)|(symbian)/i));

          if(result !== null)
          {
              return "mobile";
          } else {
              return "desktop";
          }
      }

      function positionElements()
      {
          //original resolution is 1920x993
          //first scale it the innerWidth and check if the newheight is less than the innerHeight
          //if newHeight is equal or less than innerHeight, keep the innerWidth and newHeight
          //center mastercontainer by the y axis: (innerHeight - newheight) / 2

          //if the newHeight is greater than innerHeight, then scale it by innerHeight and keep the newWidth
          //center mastercontainer by the x axis: (innerWidth - newWidth) / 2

          var masterContainer = document.getElementById("masterContainer");

          var BASE_WIDTH = 1920;
          var BASE_HEIGHT = 993;

          var DOCUMENT_WIDTH = document.documentElement.clientWidth;
          var DOCUMENT_HEGIHT = document.documentElement.clientHeight;

          //start by using width as base
          var newHeight = Math.round((BASE_HEIGHT * DOCUMENT_WIDTH) / BASE_WIDTH);

          //if the scaled down height exceeds the screen height
          if(newHeight > DOCUMENT_HEGIHT)
          {
              //then use height as base
              var newWidth = Math.round((BASE_WIDTH * DOCUMENT_HEGIHT) / BASE_HEIGHT);
              masterContainer.style.left = Math.round((DOCUMENT_WIDTH - newWidth) / 2) + "px";
              masterContainer.style.scale = DOCUMENT_HEGIHT / BASE_HEIGHT;

          } else {
              //but if using width as base because scale down height is smaller than screen height
              masterContainer.style.top = Math.round((DOCUMENT_HEGIHT - newHeight) / 2) + "px";
              masterContainer.style.scale = DOCUMENT_WIDTH / BASE_WIDTH;
          }

          if(document.documentElement.clientHeight < 400)
          {
              document.getElementById("audioVisualizerBinCanvas").width = "900";
          }
      }

      async function robotoReady(){
        await Promise.all([
          document.fonts.load('300 16px "Roboto"'),
          document.fonts.load('300 19px "Roboto"'),
          document.fonts.load('300 20px "Roboto"'),
          document.fonts.load('300 50px "Roboto"'),

          document.fonts.load('400 16px "Roboto"'),
          document.fonts.load('400 19px "Roboto"'),
          document.fonts.load('400 20px "Roboto"'),
          document.fonts.load('400 50px "Roboto"'),

          document.fonts.load('500 16px "Roboto"'),
          document.fonts.load('500 19px "Roboto"'),
          document.fonts.load('500 20px "Roboto"'),
          document.fonts.load('500 50px "Roboto"'),

          document.fonts.load('300 16px "Roboto Condensed"'),
          document.fonts.load('300 19px "Roboto Condensed"'),
          document.fonts.load('300 20px "Roboto Condensed"'),
          document.fonts.load('300 50px "Roboto Condensed"'),

          document.fonts.load('400 16px "Roboto Condensed"'),
          document.fonts.load('400 19px "Roboto Condensed"'),
          document.fonts.load('400 20px "Roboto Condensed"'),
          document.fonts.load('400 50px "Roboto Condensed"'),

          document.fonts.load('500 16px "Roboto Condensed"'),
          document.fonts.load('500 19px "Roboto Condensed"'),
          document.fonts.load('500 20px "Roboto Condensed"'),
          document.fonts.load('500 50px "Roboto Condensed"'),
      ])
      };

      //loads fonts first
      robotoReady().then(function(){

        positionElements();
        init();

        //keep mobile screen from dimming every 5 seconds
        setInterval(function(){
            keepScreenAwake();
        }, 5000);
        
      });

  </script>

</html>
