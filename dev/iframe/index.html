<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Hello Giftagram!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" type="image/png" href="favicon.png">
  </head>
  <body>

    <div id="bufferAnimation" class="bufferAnimation">
      <canvas id="bufferingCanvas"></canvas>
    </div>

    <div id="entryGreetingText"></div>

      <div id="audioVisualizerWindowContainer">
          <canvas id="audioVisualizerBinCanvas" width="500" height="250"></canvas>
          <div id="audioVisualizerTextContainer">
              <div id="audioVisualizerTitle" class="audioVisualizerText">NOW PLAYING:</div>
              <div id="audioVisualizerText" class="audioVisualizerText"></div>
              <div id="audioVisualizerPlayButton"></div>
              <div id="audioVisualizerPauseButton"></div>
              <div id="audioVisualizerRepeatButton"></div>
          </div>
          <div id="audioVisualizerBackground"></div>
      </div>

      <div id="iframeDiv"></div>

  </body>

  <script src="js/gsap.min.js"></script>
  <script src="js/easeljs.min.js"></script>
  <script src="js/audiomanager.js"></script>
  <script src="js/audiovisualizer.js"></script>
  <script src="js/bufferanimation.js"></script>

  <script>

      //file URL, type of media
      var preloadArray = new Array();
          preloadArray.push(["audio/climatechange.mp3", "audio"]);
          preloadArray.push(["audio/main.mp3", "audio"]);
          preloadArray.push(["splash/video/cello.mp4", "video"]);
          preloadArray.push(["splash/video/conductor.mp4", "video"]);
          preloadArray.push(["splash/video/violins.mp4", "video"]);
          preloadArray.push(["main/images/advancedMaskTransitions3.jpg", "image"]);
          preloadArray.push(["main/images/AI4.jpg", "image"]);
          preloadArray.push(["main/images/animatedAndividualComponents2.jpg", "image"]);
          preloadArray.push(["main/images/audiovisualizer3.jpg", "image"]);
          preloadArray.push(["main/images/background1.jpg", "image"]);
          preloadArray.push(["main/images/background2.jpg", "image"]);
          preloadArray.push(["main/images/bluebg.jpg", "image"]);
          preloadArray.push(["main/images/drone4.jpg", "image"]);
          preloadArray.push(["main/images/planningstoryboard1.jpg", "image"]);
          preloadArray.push(["main/images/splashbackground.jpg", "image"]);
          preloadArray.push(["main/images/ztransitions.jpg", "image"]);
          preloadArray.push(["main/images/ztransitions2.jpg", "image"]);

      var alreadyClicked = false;
      var preloadCounter = 0;

      function init()
      {
          //display a preload animation visible
          var buffer = new BufferAnimation("bufferingCanvas");
          buffer.startAnimation();

          for(var i=0;i<preloadArray.length;i++)
          {
              switch(preloadArray[i][1])
              {
                  case "audio":
                    preloadAudio(preloadArray[i][0]);
                  break;

                  case "video":
                    preloadVideo(preloadArray[i][0]);
                  break;

                  case "image":
                    preloadImage(preloadArray[i][0]);
                  break;
              }
          }

          window.addEventListener("resize", function(event){
              location.reload();
          });

          //only allow experience to begin if in landscape mode
          if(isLandscapeMode() == true)
          {
              window.addEventListener("message", function(event){

                  switch(event.data)
                  {
                      //load main page after splash page is finished
                      case "iframeClicked":

                          if(currentAudioState == "playing")
                          {
                              music.fadeOut(currentAudioTrack, 2);
                          }

                          setTimeout(function(){

                              loadNewSong("mainMusic", "audio/main.mp3");
                              changeAudioTrackTitle("Somewhere But Not Here - Nicolai Patricio");
                          }, 2000);

                          document.getElementById("mainIframe").src = "main/main.html";
                      break;

                      case "moveAudioPlayer":

                        gsap.to("#audioVisualizerWindowContainer", {
                          y: "-= 75",
                          duration: .5,
                        });
                      break;
                  }
              });

          } else {

              //if not in landscape mode, display "turn your screen into landscape mode to begin"
              document.getElementById("entryGreetingText").innerHTML = "Please rotate your screen to landscape mode";
          }
      }

      //fade out "this contains audio, click anywhere to begin" text
      function fadeOutGreetingText()
      {
          gsap.to("#entryGreetingText", {
              opacity: 0,
              duration: .35,
          });

          gsap.fromTo("#audioVisualizerWindowContainer",
          {
              opacity: 0,
          },
          {
              opacity: 1,
              duration: 4,
              delay: 10,
          });

          setTimeout(function(){

              changeAudioTrackTitle("Climate Change - Hans Zimmer, Planet Earth III");

          }, 10500);
      }

      //on resize, just reload the entire website
      //on resize, run this function to check if in landscape mode
      //once in landscape mode, show the intro message
      //if the screen width is lesser than the height, then it is in portrait mode
      function isLandscapeMode()
      {
          var screenWidth = window.innerWidth;
          var screenHeight = window.innerHeight;

          if(screenWidth < screenHeight)
          {
              return false;
          } else {
              return true;
          }
      }

      //preload all the big assets like video and audio and images
      //display preloader animation
      //only after the preloader is completed, then allow user to click to begin
      function checkPreloader()
      {
          if(preloadCounter == preloadArray.length) //17 files to preload
          {
              //make preloader animation invisible
              document.getElementById("bufferAnimation").style.display = "none";

              //allow click to begin
              window.addEventListener("click", function(){

                  //first click to enter splash page
                  if(alreadyClicked == false)
                  {
                      alreadyClicked = true;

                      loadNewSong("splashMusic", "audio/climatechange.mp3");

                      fadeOutGreetingText();

                      //only load splash page after click to allow audio browser persmission to play
                      var iframe = document.createElement("iframe");
                          iframe.id = "mainIframe";
                          iframe.src = "splash/splash.html";

                      document.getElementById("iframeDiv").appendChild(iframe);
                  }
              });

              //show click message
              document.getElementById("entryGreetingText").innerHTML = "This portfolio is entirely Javascript driven and custom designed for Giftagram<br>Click anywhere to begin";
          }
      }

      function preloadAudio(audioURL)
      {
          var audio = new Audio(audioURL);

          audio.onloadeddata = function(){
              preloadCounter++
              checkPreloader();
          };
      }

      function preloadVideo(videoURL)
      {
          var video = document.createElement("video");
              video.src = videoURL;
              video.preload = "auto";

          video.onloadeddata = function(){
              preloadCounter++
              checkPreloader();
          };
      }

      function preloadImage(imageURL)
      {
          var image = new Image();
              image.src = imageURL;

          image.onload = function(){
              preloadCounter++
              checkPreloader();
          }
      }

      init();

  </script>

</html>
